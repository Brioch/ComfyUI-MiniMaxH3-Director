name: Bug report
description: Something in the Director, the preview, Retake or Enhance Prompt does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The three things that make a report fixable are the
        **console output**, the **workflow JSON**, and **which model files** you loaded.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load example_workflows/...
        2. Drop an image on the main track
        3. Press Run
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: >
        The full traceback from the ComfyUI terminal window, not just the last line.
        Errors that start in `minimax_*.py` are ours; errors from `comfy/` may still be
        triggered by us, so paste it either way.
      render: shell
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: >
        Drag the `.json` into this box (Workflow -> Export). Without it most timeline
        bugs cannot be reproduced.
    validations:
      required: false

  - type: dropdown
    id: node
    attributes:
      label: Which node
      multiple: true
      options:
        - MiniMax H3 Director
        - MiniMax H3 Preview Override
        - MiniMax H3 Retake Stitch
        - MiniMax H3 Enhance Prompt
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Reference mode
      options:
        - Refs OFF (fl2va)
        - Refs ON (ref2va)
        - Not sure
    validations:
      required: true

  - type: input
    id: models
    attributes:
      label: Model files
      description: Exact filenames of diffusion model, text encoder and both VAEs.
      placeholder: minimax_h3_fl2va_pruned_fp8_scaled / qwen3vl_32b_minimax_h3_nvfp4_awq / video_vae_fp16 / audio_vae_fp32
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: ComfyUI version, frontend version, this node's version, OS.
      placeholder: "ComfyUI 0.30.0, frontend 1.47.12, node 0.1.0, Windows 11"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: GPU and VRAM
      placeholder: "RTX 5060 Ti 16 GB"
    validations:
      required: true

  - type: textarea
    id: browser
    attributes:
      label: Browser console (only for timeline / preview UI bugs)
      description: F12 -> Console. Needed for anything about dragging, resizing, or the preview window.
      render: shell
    validations:
      required: false
